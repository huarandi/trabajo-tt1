name: Generar y publicar Javadoc

on:
  push:
    branches:
      - main

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-javadoc:
    name: Build Javadoc y Deploy a GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generar Javadoc con Maven
        run: mvn javadoc:javadoc --no-transfer-progress

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Javadoc como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
